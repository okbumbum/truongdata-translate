<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><link rel="manifest" href="/manifest.json"><title>TRUONGDATA Translate AI</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#17243d;font:16px system-ui,sans-serif}main{max-width:1000px;margin:8vh auto;padding:20px}header{display:flex;align-items:center;gap:15px;margin-bottom:28px}header b{background:#2563eb;color:white;border-radius:16px;padding:15px;font-size:24px}h1{font-size:25px;margin:0}p{color:#62718b;margin:5px 0}section{background:white;border:1px solid #dce4f0;border-radius:24px;padding:20px;box-shadow:0 12px 40px #223a7010}.langs,.panels{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}.langs strong{text-align:center}.panels{grid-template-columns:1fr 1fr;margin-top:16px}textarea{width:100%;height:240px;resize:vertical;border:1px solid #dce4f0;border-radius:15px;padding:18px;font:inherit;line-height:1.65;color:inherit}#out{background:#f4f7ff}button{cursor:pointer;border:0;border-radius:12px;padding:12px 17px;font:inherit;font-weight:600;background:#eaf0fa;color:#244c9d}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}#go{background:#2563eb;color:white;flex:1}#status{min-height:24px;font-size:14px;margin-top:12px}footer{text-align:center;color:#62718b;font-size:13px;margin:22px}input{padding:10px;border:1px solid #dce4f0;border-radius:10px;width:100%}details{margin-top:15px;color:#62718b;font-size:14px}@media(max-width:600px){main{margin:0 auto;padding:15px}section{padding:14px}.panels{grid-template-columns:1fr}textarea{height:160px}h1{font-size:20px}}</style><main><header><b>文 A</b><div><h1>TRUONGDATA Translate AI</h1><p>Dịch tự nhiên · Giao tiếp hằng ngày</p></div></header><section><div class="langs"><strong id="from">🇻🇳 Tiếng Việt</strong><button id="swap" aria-label="Đảo ngôn ngữ">⇄</button><strong id="to">🇺🇸 English</strong></div><div class="panels"><textarea id="src" maxlength="3000" placeholder="Nhập nội dung cần dịch..." aria-label="Văn bản gốc"></textarea><textarea id="out" readonly placeholder="Bản dịch sẽ hiện tại đây" aria-label="Bản dịch"></textarea></div><div class="actions"><button id="clear">Xóa</button><button id="go">Dịch ngay</button><button id="copy">Sao chép</button></div><p id="status" role="status"></p><details><summary>Mã truy cập (nếu chủ app yêu cầu)</summary><input id="code" type="password" placeholder="Mã truy cập" autocomplete="off"></details></section><footer>TRUONGDATA · Nâng tầm trải nghiệm - Tối ưu chi phí<br>Văn bản được gửi tới Gemini để dịch. Không nhập thông tin bí mật.</footer></main><script>
const $=id=>document.getElementById(id);let reverse=false,busy=false;function status(t){$('status').textContent=t}function sync(){ $('from').textContent=reverse?'🇺🇸 English':'🇻🇳 Tiếng Việt';$('to').textContent=reverse?'🇻🇳 Tiếng Việt':'🇺🇸 English';$('src').placeholder=reverse?'Enter English text...':'Nhập nội dung cần dịch...'}$('swap').onclick=()=>{if(busy)return;reverse=!reverse;if($('out').value){$('src').value=$('out').value;$('out').value=''}sync()};$('clear').onclick=()=>{if(busy)return;$('src').value='';$('out').value='';status('');$('src').focus()};$('copy').onclick=async()=>{if(!$('out').value)return;try{await navigator.clipboard.writeText($('out').value);status('Đã sao chép!')}catch{$('out').select();status('Nhấn Ctrl+C để sao chép.')}};async function translate(){if(busy||!$('src').value.trim())return;busy=true;$('go').disabled=true;$('swap').disabled=true;$('clear').disabled=true;$('src').readOnly=true;$('out').value='';status('Đang dịch…');try{let r=await fetch('/api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:$('src').value,direction:reverse?'en-vi':'vi-en',code:$('code').value})});let d=await r.json();if(!r.ok)throw Error(d.error||'Không dịch được');$('out').value=d.translation;status('Hoàn tất')}catch(e){status(e.message==='Failed to fetch'?'Không kết nối được máy chủ.':e.message)}finally{busy=false;$('go').disabled=false;$('swap').disabled=false;$('clear').disabled=false;$('src').readOnly=false}}$('go').onclick=translate;$('src').onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')translate()};if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></html>
